name: Update tables

on:
  # rubygems.org publishes a dump every Monday around 21:20 UTC.
  schedule:
    - cron: "17 6 * * 2"
  workflow_dispatch:
    inputs:
      force:
        description: Export again even if tables/ already comes from the latest dump
        type: boolean
        default: false

concurrency: update-tables

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    services:
      # The runner's psql client talks to this server over port 5432.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Check over TCP: the image's first-start server listens only on a
        # socket, so this passes once the real server is up.
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # A throwaway server that only this job can reach.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bin/update ${{ inputs.force && '--force' || '' }}
      - name: Commit tables/
        run: |
          git add tables DUMP
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update tables for $(cut -d/ -f3 DUMP)"
          git push
