# Tools that test/run and bin/update need. `postgres` provides the client
# (psql, pg_restore, createdb, dropdb); the server runs from compose.yml.
[tools]
postgres = "19"
python = "3"

[env]
PGHOST = "{{ get_env(name='PGHOST', default='localhost') }}"
PGUSER = "{{ get_env(name='PGUSER', default='postgres') }}"
PGPASSWORD = "{{ get_env(name='PGPASSWORD', default='postgres') }}"
